name: Verify complaint appointment
on:
  pull_request:
    paths:
      - 'src/components/complaint-form.tsx'
      - 'src/app/(dashboard)/admin/complaints/[id]/**'
      - 'src/lib/appointments*'
      - '.github/workflows/complaint-appointment-check.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run src/lib/appointments.test.ts 'src/app/(dashboard)/admin/complaints/[id]/page.test.tsx'
