<script>

Two Way Bib Tap",34,"Per Unit"],"32":["Floor trap",25,"Per Unit"],"33":["Heat Detector",105,"Per Unit"],"34":["Shoe Rack",30,"Per Unit"]};
const CATS=[["Room Vacated",[["Room vacated",[0,0,0],[]]]],
["Electrical Fixtures",[["Wall Fans",[1,2,2],[5],["","16\" wall fan","16\" wall fan"]],["Lightings",[3,3,4],[6],["1×4ft + 2×2ft","2×4ft + 1×2ft","2×4ft + 2×2ft"]],["13A Power Sockets & Air-Con Power Socket",[2,4,6],[21]],["Heat Detector at Ceiling",[1,1,1],[33]]]],
["Bathroom Fixtures",[["Shower Heads",[1,1,1],[27]],["Hose with Bidet & bib tap",[1,1,1],[30,31]],["Sitting WC & Cistern",[1,1,1],[29]],["Handwash basin with tap",[1,1,1],[24,25]],["Mirror above handwash basin",[1,1,1],[26]],["Aluminium framed door with lockset",[1,1,1],[23]]]],
["Bed Bunks & Furniture",[["Double Decker Bed Frames",[1,2,3],[7]],["Mattress removed",[-1,-1,-1],[]],["Lockers & Locker Lock",[2,4,6],[11],["","475L gross","475L per pax"]],["Tables",[-1,-1,-1],[8]],["PVC Chairs",[-1,-1,-1],[9]],["Shelf for dry food",[1,1,1],[10]],["Shoe rack",[1,1,1],[34],"outside room unit"]]],
["Wall Paint",[["Stickers removed",[0,0,0],[]],["Wall",[0,0,0],[16]],["Ceiling",[-1,-1,-1],[17]]]],
["Main Fire Door",[["Door paint inside face",[0,0,0],[]],["Door closure",[1,1,1],[2]],["Door lock",[1,1,1],[3,4]]]],
["Windows & Grilles",[["Windows",[-1,-1,-1],[18]],["Window lock",[-1,-1,-1],[19]],["Curtain sets",[1,1,1],[12]],["Window railings & hooks",[-1,-1,-1],[13,14]],["Window grilles",[1,1,1],[],"bedroom windows"]]],
["Room Clear",[["No rubbish",[0,0,0],[]],["No extra items",[0,0,0],[]]]],
["Room Completed",[["No defects",[0,0,0],[]],["No missing items",[0,0,0],[]],["Locked",[0,0,0],[]],["Keys returned",[0,0,0],[4]]]]];
const mx=(u,p)=>{const s=u[1][p];return s>0?s:s<0?99:1};
const AB=["Vacated","Electrical","Bathroom","Bed/Furn","Paint","Door","Window","Clear","Done"],$=s=>document.querySelector(s);
const S={tab:"sum",blk:"C",recs:[],cur:null,open:-1};let DB=null;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lv=b=>Object.keys(RM[b]),rl=(b,l)=>RM[b][l].split(",").flatMap(x=>{const[a,t]=x.split(":"),[s,e]=a.split("-").map(Number);return Array.from({length:e-s+1},(_,i)=>[s+i,+t])});
const pi=r=>r.t/2-1,cs=(r,c)=>{const v=CATS[c][1].map((_,i)=>r.it[c+"."+i]);return v.some(x=>x>0)?"x":v.every(x=>x===0)?"o":"-"};
const comp=r=>CATS.filter((_,c)=>cs(r,c)=="o").length/9;
const costs=r=>{const o=[];CATS.forEach((c,ci)=>c[1].forEach((s,si)=>{const q=r.it[ci+"."+si];if(q>0&&s[2].length){const u=s[2].reduce((a,n)=>a+COST[n][1],0);o.push({n:s[0],q,u,a:q*u})}}));return o};
const tot=r=>costs(r).reduce((a,c)=>a+c.a,0),rm=n=>"RM "+n.toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});

const toast=t=>{const e=$("#t");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2600)};
try{const q=indexedDB.open("klg-handover",1);q.onupgradeneeded=()=>q.result.createObjectStore("ins",{keyPath:"id"});q.onsuccess=()=>{DB=q.result;const g=DB.transaction("ins").objectStore("ins").getAll();g.onsuccess=()=>{S.recs=g.result;render()}}}catch(e){}
const put=r=>{const i=S.recs.findIndex(x=>x.id==r.id);i<0?S.recs.push(r):S.recs[i]=r;try{DB.transaction("ins","readwrite").objectStore("ins").put(r)}catch(e){}};
function start(b,l,room){const pr=latest()[b+room],it={};if(pr)for(const k in pr.it)if(pr.it[k]===0)it[k]=0;
S.cur={id:b+room+"-"+Date.now(),b,l,room,t:rl(b,l).find(x=>x[0]==room)[1],round:pr?pr.round+1:1,date:new Date().toISOString().slice(0,10),reason:pr?"Follow-up inspection":"Handover at Vacation",by:"",it,nt:{},ph:{}};S.tab="ins";S.open=-1;render()}
function pdf(r){const d=new jspdf.jsPDF();let y=15;const ln=(t,x=14,z=10,b)=>{if(y>280){d.addPage();y=15}d.setFontSize(z);d.setFont("helvetica",b?"bold":"normal");d.text(String(t),x,y);y+=z*.5+2};
ln("JOINT INSPECTION FORM",14,15,1);ln("KLG Campus Residence - Block C & D, UTM | Handover Report",14,9);
ln(`Block ${r.b}  Level ${r.l}  Room ${r.room} (${r.t}-Pax)  Round ${r.round}`,14,11,1);ln(`Date: ${r.date}  Reason: ${r.reason}  Inspector: ${r.by||"-"}`);
ln(`Compliance: ${Math.round(comp(r)*100)}%   Estimated repair cost: ${rm(tot(r))}`,14,10,1);y+=2;
CATS.forEach((c,ci)=>{ln(`${ci+1}. ${c[0]}  [${{o:"OK",x:"FAULT","-":"NOT CHECKED"}[cs(r,ci)]}]`,14,11,1);
c[1].forEach((s,si)=>{const v=r.it[ci+"."+si];ln(`${s[0]}${s[1][pi(r)]>0?" (std "+s[1][pi(r)]+")":""}: ${v===undefined?"-":v?"FAULT x"+v:"OK"}`,18)});
if(r.nt[ci])ln("Remarks: "+r.nt[ci],18,9);const P=r.ph[ci]||[];P.forEach((p,k)=>{if(k%3==0&&y>235){d.addPage();y=15}d.addImage(p,"JPEG",18+(k%3)*60,y,57,43);if(k%3==2||k==P.length-1)y+=46})});
y+=6;ln("Landlord: ______________________      Tenant: ______________________",14,10);return d}
async function dl(name,data){try{const d=await (window.claude?.use("downloads"));if(d){await d.save({filename:name,data});return}}catch(e){if(e.code==="declined")return}const blob=data instanceof Blob?data:new Blob([data]);const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function exportAll(){toast("Building package…");const z=new JSZip(),L=latest(),wb=XLSX.utils.book_new(),cr=[["Block","Room","Item","Qty","Unit RM","Amount RM"]];
S.recs.forEach(r=>z.file(`Block ${r.b}/Level ${r.l}/Room_${r.room}_R${r.round}.pdf`,pdf(r).output("arraybuffer")));
for(const b of"CD"){const rows=[["Level","Room","Type",...CATS.map((_,i)=>AB[i]),"Compliance %","Round","Inspection Report","Repair Cost RM","Cost of Repair"]],lk=[];
for(const l of lv(b))for(const[room,t]of rl(b,l)){const r=L[b+room];if(!r){rows.push([l,room,t+" Pax",...AB.map(_=>"x"),0,0,"",0,""]);continue}
const cc=costs(r),f=cr.length+1;cc.forEach(c=>cr.push([b,room,c.n,c.q,c.u,c.a]));const p=`Block ${b}/Level ${l}/Room_${room}_R${r.round}.pdf`;
rows.push([l,room,t+" Pax",...CATS.map((_,i)=>cs(r,i)=="o"?"o":"x"),comp(r),r.round,"Open report",tot(r),cc.length?"See costs":"-"]);lk.push([rows.length,p,cc.length?f:0])}
const ws=XLSX.utils.aoa_to_sheet(rows);lk.forEach(([n,p,f])=>{ws["O"+n].l={Target:p};if(f)ws["Q"+n].l={Target:`#'Repair Costs'!A${f}`}});
for(let n=2;n<=rows.length;n++)ws["M"+n].z="0%";XLSX.utils.book_append_sheet(wb,ws,"Block "+b)}
XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cr),"Repair Costs");z.file("Handover_Summary.xlsx",XLSX.write(wb,{type:"array",bookType:"xlsx"}));
dl("KLG_Handover_Reports.zip",await z.generateAsync({type:"blob"}))}
function modal(h){const e=document.createElement("div");e.className="md";e.innerHTML=`<div>${h}<p><button onclick="this.closest('.md').remove()">Close</button></p></div>`;e.onclick=x=>{if(x.target==e)e.remove()};document.body.append(e)}
function detail(id,cost){const r=S.recs.find(x=>x.id==id);if(cost){const c=costs(r);return modal(`<h3>Cost of repair · ${r.b}-${r.room}</h3>`+(c.length?`<table>${c.map(x=>`<tr><td>${esc(x.n)}</td><td>${x.q} × ${rm(x.u)}</td><td>${rm(x.a)}</td></tr>`).join("")}<tr><th>Total</th><th></th><th>${rm(tot(r))}</th></tr></table>`:"<p>No faults recorded.</p>")+`<p class="n">Material + labour rates from Cost of Making Good (REV 2).</p>`)}
modal(`<h3>Inspection report · ${r.b}-${r.room} · Round ${r.round}</h3><p>${r.date} · ${esc(r.reason)} · ${comp(r)*100|0}% compliant</p>`+CATS.map((c,i)=>`<p><b>${i+1}. ${c[0]}</b> <span class="${cs(r,i)}">${{o:"OK",x:"FAULT","-":"not checked"}[cs(r,i)]}</span>${(r.ph[i]||[]).length?" · 📷"+r.ph[i].length:""}${r.nt[i]?"<br><i>"+esc(r.nt[i])+"</i>":""}</p>`).join("")+`<p><button class="p" onclick="dl('Room_${r.room}_R${r.round}.pdf',pdf(S.recs.find(x=>x.id=='${r.id}')).output('blob'))">Download PDF</button></p>`)}
function sum(){const L=latest(),b=S.blk,all=lv(b).flatMap(l=>rl(b,l).map(x=>[l,...x])),rs=all.map(x=>L[b+x[1]]).filter(Boolean);
const full=rs.filter(r=>comp(r)==1).length,c=rs.reduce((a,r)=>a+tot(r),0),avg=all.length?rs.reduce((a,r)=>a+comp(r),0)/all.length:0;
return`<div class="row" style="margin-bottom:10px">${["C","D"].map(k=>`<button class="${k==b?"on":""}" data-a="blk" data-v="${k}">Block ${k}</button>`).join("")}<button class="p" data-a="exp">⬇ Export ZIP (PDFs + Summary.xlsx)</button></div>
<div class="st"><div><b>${all.length}</b><span>Rooms</span></div><div><b>${rs.length}</b><span>Inspected</span></div><div><b>${full}</b><span>100% complete</span></div><div><b>${Math.round(avg*100)}%</b><span>Overall compliance</span></div><div><b>${rm(c)}</b><span>Est. repair cost</span></div></div>
<div class="bar" style="margin-bottom:12px"><i style="width:${avg*100}%"></i></div>`+lv(b).map(l=>{const rr=rl(b,l);return`<details class="cd"><summary>Level ${l} <span class="n" style="font-weight:400">· ${rr.filter(x=>L[b+x[0]]&&comp(L[b+x[0]])==1).length}/${rr.length} complete</span></summary><div class="tw"><table><tr><th>Room</th><th>Type</th>${AB.map(a=>`<th>${a}</th>`).join("")}<th>%</th><th>Report</th><th>Repair</th></tr>`+rr.map(([room,t])=>{const r=L[b+room];return`<tr><td><a class="l" data-a="go" data-v="${b}|${l}|${room}">${room}</a></td><td>${t}P</td>${CATS.map((_,i)=>{const s=r?cs(r,i):"-";return`<td class="${s}">${{o:"✓",x:"✗","-":"·"}[s]}</td>`}).join("")}<td>${r?Math.round(comp(r)*100)+"%":"–"}</td><td>${r?`<a class="l" data-a="rep" data-v="${r.id}">R${r.round}</a>`:"–"}</td><td>${r?`<a class="l" data-a="cost" data-v="${r.id}">${rm(tot(r))}</a>`:"–"}</td></tr>`}).join("")+`</table></div></details>`}).join("")}
function ins(){const r=S.cur;if(!r){const b=S.pb||"C",l=S.pl||lv(b)[0];return`<div class="cd"><h3 style="margin-top:0">New inspection</h3><div class="row"><div><label>Block</label><select data-a="pb">${["C","D"].map(k=>`<option ${k==b?"selected":""}>${k}</option>`)}</select></div><div><label>Level</label><select data-a="pl">${lv(b).map(k=>`<option ${k==l?"selected":""}>${k}</option>`)}</select></div><div><label>Room</label><select id="pr">${rl(b,l).map(x=>`<option value="${x[0]}">${x[0]} · ${x[1]} pax</option>`)}</select></div></div><p><button class="p" data-a="begin">Start inspection</button></p><p class="n">Rooms with an earlier inspection start a follow-up round: items already passed carry over, faulty items must be re-checked.</p></div>`}
const p=pi(r);return`<div class="cd"><b>Block ${r.b} · Level ${r.l} · Room ${r.room}</b> <span class="ch">${r.t} PAX</span> <span class="ch">Round ${r.round}</span><div class="row" style="margin-top:8px"><div><label>Date</label><input type="date" data-a="date" value="${r.date}"></div><div><label>Reason</label><select data-a="reason">${["Handover at Vacation","Follow-up inspection","Periodic","Other"].map(k=>`<option ${k==r.reason?"selected":""}>${k}</option>`)}</select></div><div><label>Inspector</label><input data-a="by" value="${esc(r.by)}" placeholder="Name"></div></div></div>`+
CATS.map((c,ci)=>{const s=cs(r,ci),o=S.open==ci;return`<div class="cd cat"><div class="h" data-a="tg" data-v="${ci}"><span>${ci+1}. ${c[0]}</span><span class="ch ${s}">${{o:"OK",x:"Fault","-":"Pending"}[s]}</span><span>${o?"▾":"▸"}</span></div>`+(o?c[1].map((u,si)=>{const k=ci+"."+si,v=r.it[k];return`<div class="it"><span>${u[0]} <span class="n">${u[1][p]>0?"· std "+u[1][p]:u[1][p]<0?"· qty not in Appendix 4":""}${u[3]&&(Array.isArray(u[3])?u[3][p]:u[3])?" · "+(Array.isArray(u[3])?u[3][p]:u[3]):""}</span></span>${v>0?`<button data-a="q" data-v="${k}|-1">−</button><b>${v}</b><button data-a="q" data-v="${k}|1">+</button>`:""}<button class="${v===0?"go":""}" data-a="ok" data-v="${k}">✓ OK</button><button class="${v>0?"no":""}" data-a="bad" data-v="${k}|${mx(u,p)}">✗ Fault</button></div>`}).join("")+`<div class="ph">${(r.ph[ci]||[]).map(x=>`<img src="${x}">`).join("")}</div><label class="p" style="display:inline-block;background:var(--ac);color:var(--ac-ink);padding:8px 12px;border-radius:8px;cursor:pointer;width:auto">📷 Take photo<input type="file" accept="image/*" capture="environment" multiple hidden data-a="ph" data-v="${ci}"></label><textarea rows="2" style="margin-top:8px" placeholder="Remarks / rectification required" data-a="nt" data-v="${ci}">${esc(r.nt[ci]||"")}</textarea>`:"")+`</div>`}).join("")+
`<div class="ft"><div><b>${Math.round(comp(r)*100)}%</b> compliant<br><span class="n">Est. repair ${rm(tot(r))}</span></div><button data-a="cancel">Cancel</button><button class="p" data-a="save">Save &amp; PDF</button></div>`}

const A={tab:v=>{S.tab=v;render()},blk:v=>{S.blk=v;render()},exp:exportAll,go:v=>start(...v.split("|")),rep:v=>detail(v),cost:v=>detail(v,1),
pb:(v,e)=>{S.pb=e.value;S.pl=null;render()},pl:(v,e)=>{S.pl=e.value;render()},begin:()=>start(S.pb||"C",S.pl||lv(S.pb||"C")[0],+$("#pr").value),
tg:v=>{S.open=S.open==v?-1:+v;render()},ok:v=>{S.cur.it[v]=0;render()},bad:v=>{const[k,n]=v.split("|");S.cur.it[k]=+n;render()},q:v=>{const[k,d]=v.split("|"),r=S.cur,m=mx(CATS[k.split(".")[0]][1][k.split(".")[1]],pi(r));r.it[k]=Math.max(1,Math.min(m,r.it[k]+ +d));render()},
date:(v,e)=>S.cur.date=e.value,reason:(v,e)=>S.cur.reason=e.value,by:(v,e)=>S.cur.by=e.value,nt:(v,e)=>S.cur.nt[v]=e.value,
ph:async(v,e)=>{const a=S.cur.ph[v]=S.cur.ph[v]||[];for(const f of e.files)a.push(await shrink(f));render()},cancel:()=>{S.cur=null;render()},

const shrink=f=>new Promise(res=>{const i=new Image();i.onload=()=>{const s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.7))};i.src=URL.createObjectURL(f)});
