function matrix(rr){let names=NAMES.concat(FAC.flatMap(c=>c[1]));return `<div class="cd matrix-wrap"><table class="matrix"><thead><tr><th rowspan="2">Room</th><th rowspan="2">Type</th><th colspan="5">Furniture</th>${FAC.map(c=>`<th colspan="${c[1].length}">${c[0]}</th>`).join('')}<th rowspan="2">Done %</th><th rowspan="2">Report</th></tr><tr>${names.map(n=>`<th><span>${n==='A/C'?'A/C · 2P: 1 HP / 4P: 2 HP':n}</span></th>`).join('')}</tr></thead><tbody>${rr.map(x=>{let r=latest(x.room),p=progress(r,x);return `<tr><td><a class="l" onclick="start('${x.room}')">${x.room}</a></td><td>${x.p}P</td>${NAMES.map((n,i)=>`<td title="${n}">${itemSymbol(r,i)}</td>`).join('')}${FAC.flatMap(c=>c[1]).map(n=>`<td title="${facilityLabel(n,x)}">${r?.fac?.[n]?.status==='good'?'✅':r?.fac?.[n]?.status==='defect'?'❌':'—'}</td>`).join('')}<td><b>${p.pct}%</b></td><td>${r?`<button onclick="view('${x.room}')">R${r.round}</button>`:'—'}</td></tr>`}).join('')}</tbody></table></div>`}

function summary(){const rr=Object.values(ROOMS).filter(r=>r.b===block&&(!level||r.l==level)&&r.room.includes(query.toUpperCase())),ps=rr.map(x=>progress(latest(x.room),x)),done=ps.reduce((s,p)=>s+p.done,0),total=ps.reduce((s,p)=>s+p.total,0);return `<div class="row noprint"><button class="${block==='A'?'on':''}" onclick="block='A';level='';render()">Block A</button><button class="${block==='B'?'on':''}" onclick="block='B';level='';render()">Block B</button><input aria-label="Search room" placeholder="Search room" value="${esc(query)}" oninput="query=this.value;render();document.querySelector('[aria-label=\'Search room\']').focus()"><select aria-label="Level filter" onchange="level=this.value;render()"><option value="">All levels</option>${[1,2,3,4,5,6,7,8].map(l=>`<option ${level==l?'selected':''}>${l}</option>`).join('')}</select></div><div class="st" style="margin-top:12px"><div><b>${rr.length}</b><span>Rooms shown</span></div><div><b>${rr.filter(x=>latest(x.room)).length}</b><span>Inspected</span></div><div><b>${ps.filter(p=>p.done===p.total).length}</b><span>Checks complete</span></div><div><b>${total?Math.round(done/total*100):0}%</b><span>Overall checks · ${done}/${total}</span></div></div><p class="note">New inspections default to ✅ Good; select ❌ Defect only for problems. Confirm furniture ownership before completing. Completion measures inspection checks, not repair completion. Good and fully recorded Defect both count. Optional UTMSPACE checks are excluded unless enabled. ✅ Good · ❌ Defect · — Not checked / optional skipped.</p>`+[...new Set(rr.map(r=>r.l))].map(l=>`<h3>Level ${l}</h3>${matrix(rr.filter(x=>x.l===l))}`).join('')}

function owner(i,o){let v=cur.items[i][o],ref=cur.ref[o][i];if(!v.enabled&&ref===0)return '';return `<section style="border:0;padding:4px 0"><div class="it"><span><b>${OWNERS[o]}</b> · Qty ${v.qty}${o?' · Optional':''}</span>${v.enabled?`<button class="${v.confirm?'on':''}" onclick="cur.items[${i}][${o}].confirm=!cur.items[${i}][${o}].confirm;render()">${v.confirm?'✓ Owner confirmed':'✓ Confirm owner'}</button><button class="${v.status==='good'?'go':''}" onclick="status(${i},${o},'good')">✅ Good</button><button class="${v.status==='defect'?'no':''}" onclick="status(${i},${o},'defect')">❌ Defect</button>`:`<button onclick="toggle(${i},${o})">Check (optional)</button>`}</div>${v.enabled?`<details><summary class="note">Change owner / quantity · Photos</summary><div class="choice">${OWNERS.map((n,j)=>`<button class="${o===j?'on':''}" onclick="changeOwner(${i},${o},${j})">${n}</button>`).join('')}</div><label>Actual present qty<input type="number" min="0" step="1" value="${v.qty}" onchange="cur.items[${i}][${o}].qty=this.value"></label>${o?`<button onclick="toggle(${i},${o})">Skip UTMSPACE inspection</button>`:''}<label>Photos · Upload from gallery<input type="file" accept="image/*" multiple onchange="photos(${i},${o},this.files)"></label><label class="camera-button">📷 Take photo<input type="file" accept="image/*" capture="environment" hidden onchange="photos(${i},${o},this.files)"></label><div class="photos">${v.photos.map((p,j)=>`<img src="${p}" alt="Furniture photo"><button onclick="cur.items[${i}][${o}].photos.splice(${j},1);render()">Remove</button>`).join('')}</div></details>${v.status==='defect'?v.defects.map((d,j)=>`<div class="fields"><div><label>Defect</label><select onchange="cur.items[${i}][${o}].defects[${j}].type=this.value;render()">${['Broken','Missing','Other'].map(t=>`<option ${d.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div><label>Defect qty</label><input type="number" min="1" step="1" value="${d.qty}" onchange="cur.items[${i}][${o}].defects[${j}].qty=this.value"></div></div><label>Remark ${d.type==='Other'?'(required)':'(optional)'}</label><textarea oninput="cur.items[${i}][${o}].defects[${j}].remark=this.value">${esc(d.remark)}</textarea><button onclick="cur.items[${i}][${o}].defects.splice(${j},1);render()">Remove</button>`).join('')+`<button onclick="cur.items[${i}][${o}].defects.push({type:'Broken',qty:1,remark:''});render()">+ Add defect</button>`:''}`:''}</section>`}
function changeOwner(i,from,to){if(from===to)return;let a=cur.items[i];if(a[to].enabled||a[to].qty>0){alert('Both owners have furniture. Edit each quantity separately to preserve the split.');a[to].enabled=true;render();return;}a[to]=structuredClone(a[from]);a[to].confirm=false;a[from]={enabled:false,confirm:false,qty:0,status:'',defects:[],photos:[]};render()}

function filterInspectionRooms(value){const q=value.trim().toUpperCase().replace(/\s+/g,'');const rr=Object.values(ROOMS).filter(r=>r.room.includes(q));$('#room').innerHTML=rr.map(r=>'<option value="'+r.room+'">'+r.room+' · '+r.p+'P</option>').join('')||'<option value="">No matching room</option>'}
function startSelectedRoom(){const room=$('#room').value;if(!ROOMS[room])return alert('Enter or select a valid room number.');start(room)}
function inspection(){if(!cur)return `<div class="cd"><h3>New inspection</h3><div class="row"><input id="room-search" aria-label="Search room number" placeholder="Type room number · e.g. A203 / B101 / 203" oninput="filterInspectionRooms(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();startSelectedRoom()}"><select id="room">${Object.values(ROOMS).map(r=>`<option value="${r.room}">${r.room} · ${r.p}P</option>`).join('')}</select><button class="p" onclick="startSelectedRoom()">Start inspection</button></div></div>`;return `<div class="cd"><b>Block ${cur.b} · Level ${cur.l} · Room ${cur.room}</b> <span class="ch">${cur.p}P</span> <span class="ch">Round ${cur.round}</span><div class="row" style="margin-top:10px"><div><label>Date</label><input type="date" value="${cur.date}" onchange="cur.date=this.value"></div><div><label>Reason</label><select onchange="cur.reason=this.value">${['Handover at Vacation','Follow-up inspection','Periodic','Other'].map(x=>`<option ${cur.reason===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Inspector</label><input value="${esc(cur.by)}" oninput="cur.by=this.value"></div></div>${cur.note?`<p class="note">PDF note: ${esc(cur.note)}</p>`:''}</div>`+NAMES.map((n,i)=>`<details class="cd cat" open><summary>${i+1}. ${n}</summary><div class="owner">${owner(i,0)}${owner(i,1)}</div></details>`).join('')+facilities(cur)+costReport(cur)+`<div class="ft"><div id="live-progress">${progress(cur,cur).pct}% · ${progress(cur,cur).done}/${progress(cur,cur).total} checks<br><b id="live-cost">${costSummary(cur)}</b></div><button onclick="save(false)">Save draft on this device</button><button class="p" onclick="save(true)">Submit Inspection</button></div>`}
function facilityLabel(n,r){return n==='A/C'?(r.p===4?'2 HP A/C':'1 HP A/C'):n}
function facilityTypes(n){return n.endsWith('Ceiling')?['Leaking','Moldy','Water Mark','Other']:n.endsWith('Wall')?['Moldy','Water Mark','Other']:n==='Downpipe'?['Leaking','Broken','Other']:FAC[0][1].includes(n)?['Broken','Missing','Other']:['Broken','Missing','Leaking','Other']}
function facilitiesComplete(r){return FAC.flatMap(c=>c[1]).every(n=>{let v=r.fac?.[n];return v&&['good','defect'].includes(v.status)&&(v.status==='good'||(v.type&&num(v.qty)&&+v.qty>0&&(v.type!=='Other'||v.remark.trim())))})}
function fs(n,status){cur.fac??={};cur.fac[n]??={status:'',type:facilityTypes(n)[0],qty:1,remark:'',photos:[]};cur.fac[n].status=status;render()}
function facilities(r){return FAC.map(([cat,names])=>`<details class="cd cat" open><summary>${cat}</summary>${names.map(n=>{let v=r.fac?.[n]||{status:'',type:facilityTypes(n)[0],qty:1,remark:'',photos:[]};return `<div class="it"><span><b>${facilityLabel(n,r)}</b></span><button class="${v.status==='good'?'go':''}" onclick="fs('${n}','good')">✅ Good</button><button class="${v.status==='defect'?'no':''}" onclick="fs('${n}','defect')">❌ Defect</button></div>${v.status==='defect'?`<div class="fields"><div><label>Defect</label><select onchange="cur.fac['${n}'].type=this.value;render()">${facilityTypes(n).map(t=>`<option ${v.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div><label>Defect qty</label><input type="number" min="1" step="1" value="${v.qty}" onchange="cur.fac['${n}'].qty=this.value"></div></div><label>Remark ${v.type==='Other'?'(required)':'(optional)'}</label><textarea oninput="cur.fac['${n}'].remark=this.value">${esc(v.remark)}</textarea><label>Photos · Upload from gallery<input type="file" accept="image/*" multiple onchange="facilityPhotos('${n}',this.files)"></label><label class="camera-button">📷 Take photo<input type="file" accept="image/*" capture="environment" hidden onchange="facilityPhotos('${n}',this.files)"></label><div class="photos">${(v.photos||[]).map((x,j)=>`<img src="${x}" alt="${n} defect"><button onclick="cur.fac['${n}'].photos.splice(${j},1);render()">Remove</button>`).join('')}</div>`:''}`}).join('')}</details>`).join('')}
function inspectionPhotoCount(){return cur.items.flat().reduce((n,v)=>n+(v.photos||[]).length,0)+Object.values(cur.fac||{}).reduce((n,v)=>n+(v.photos||[]).length,0)}
async function addInspectionPhotos(target,files){
 const incoming=Array.from(files);if(!incoming.length)return;
 if(inspectionPhotoCount()+photoPending+incoming.length>20)return alert('Maximum 20 photos per room. Remove a photo before adding more.');
 photoPending+=incoming.length;
 try{for(const f of incoming){let url;
  try{if(!f.type.startsWith('image/'))throw Error('Invalid image');url=URL.createObjectURL(f);let img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});
   const canvas=document.createElement('canvas'),scale=Math.min(1,1200/Math.max(img.width,img.height));canvas.width=img.width*scale;canvas.height=img.height*scale;canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);target.photos??=[];target.photos.push(canvas.toDataURL('image/jpeg',.75));
  }catch{alert('Cannot read photo: '+f.name)}finally{if(url)URL.revokeObjectURL(url)}
 }}finally{photoPending-=incoming.length;render()}
}
async function facilityPhotos(n,files){return addInspectionPhotos(cur.fac[n],files)}

function facilityReport(r){return FAC.map(([cat,names])=>`<div class="cd"><h3>${cat}</h3>${names.map(n=>{let v=r.fac?.[n];return `<p><b>${facilityLabel(n,r)}</b> · ${v?.status==='good'?'✅ Good':v?.status==='defect'?`❌ ${esc(v.type)} · Qty ${v.qty} · ${esc(v.remark)}`:'Pending'}</p><div class="photos">${(v?.photos||[]).map(p=>`<img src="${p}" alt="${n} defect">`).join('')}</div>`}).join('')}</div>`).join('')}
function toggle(i,o){if(o===0)return;cur.items[i][o].enabled=!cur.items[i][o].enabled;render()}
function status(i,o,s){let v=cur.items[i][o];v.status=s;if(s==='good')v.defects=[];else if(!v.defects.length)v.defects=[{type:'Broken',qty:1,remark:''}];render()}
async function photos(i,o,files){return addInspectionPhotos(cur.items[i][o],files)}
function save(final){if(photoPending)return alert('Please wait for photos to finish processing.');if(!cur.by.trim()||!cur.date)return alert('Enter inspector and date.');for(let v of entries(cur)){if(!num(v.qty))return alert('Actual qty must be a whole number, 0 or more.');if(v.status==='defect'){if(!v.defects.length)return alert('Add a defect type.');if(v.defects.some(d=>!num(d.qty)||d.qty<1||d.type==='Other'&&!d.remark.trim()))return alert('Defect qty must be at least 1. Other requires a remark.');if(v.defects.filter(d=>d.type!=='Missing').reduce((s,d)=>s+ +d.qty,0)>+v.qty)return alert('Broken / Other qty cannot exceed present furniture qty.')}}for(let v of Object.values(cur.fac||{})){if(v.status==='defect'&&(!num(v.qty)||+v.qty<1||v.type==='Other'&&!v.remark.trim()))return alert('Facility defect qty must be at least 1. Other requires a remark.')}if(final&&!complete(cur)){let missing=[];for(let v of entries(cur)){let name=NAMES[v.i]+' · '+OWNERS[v.o];if(!v.confirm)missing.push(name+': confirm owner');if(!['good','defect'].includes(v.status))missing.push(name+': select Good / Defect')}for(let n of FAC.flatMap(c=>c[1]))if(!['good','defect'].includes(cur.fac?.[n]?.status))missing.push(n+': select Good / Defect');return alert('Cannot complete yet. Please finish these checks:\n\n'+missing.join('\n'))}if(final){if(window.parent===window)return alert('Open Room Inspection from Check-out Rooms to submit.');if(window.inspectionSubmitting)return;window.inspectionSubmitting=true;window.parent.postMessage({type:'klg-inspection-submit',record:structuredClone(cur)},window.location.origin);return;}let next=records.filter(r=>r.id!==cur.id).concat({...structuredClone(cur),final,saved:new Date().toISOString()});try{localStorage.setItem(KEY,JSON.stringify(next));records=next}catch(e){return alert('Storage full or unavailable. Export backup before continuing. Your inspection remains open.')}let savedRoom=cur.room;block=cur.b;cur=null;tab='sum';render();alert(savedRoom+(final?' · Inspection completed and saved.':' · Draft saved.'))}
function view(room){report=latest(room);tab='rep';render()}
function reportHtml(){let r=report;return `<div class="noprint row"><button onclick="window.print()">Print / Save PDF</button><select onchange="report=records.find(r=>r.id===this.value);render()">${records.filter(x=>x.room===r.room).map(x=>`<option value="${x.id}" ${x.id===r.id?'selected':''}>Round ${x.round} · ${x.date}</option>`).join('')+facilityReport(r)+costReport(r)}</select><button onclick="cur=structuredClone(report);tab='ins';render()">Edit this round</button><button onclick="start(report.room)">Follow-up inspection</button></div><div class="cd"><h2>${r.room} · ${r.p}P · Round ${r.round}</h2><p>${esc(r.date)} · ${esc(r.by)} · ${esc(r.reason)} · ${r.final?'Completed':'Draft'}</p></div>`+NAMES.map((n,i)=>`<div class="cd"><h3>${n}</h3>${r.items[i].map((v,o)=>`<p><b>${OWNERS[o]}</b> · PDF ${r.ref[o][i]} · ${v.enabled?`Actual present ${v.qty} · Owner ${v.confirm?'confirmed':'pending'} · ${v.status||'Pending'}`:'Not inspected (optional)'}</p>${v.enabled?v.defects.map(d=>`<p>❌ ${esc(d.type)} · Qty ${d.qty} · ${esc(d.remark)}</p>`).join('')+`<div class="photos">${v.photos.map(p=>`<img src="${p}" alt="Inspection photo">`).join('')+facilityReport(r)+costReport(r)}</div>`:''}`).join('')+facilityReport(r)+costReport(r)}</div>`).join('')+facilityReport(r)+costReport(r)}
const FIXED_PRICE={'Chair':28,'Power Socket':52.2,'1G Switch':50,'2G Switch':50,'A/C Switch':50,'Toilet Switch':50,'Study Table Light Switch':50,'Toilet Basin':50,'Two-way Tap':28,'WC':430,'Sink Tap':36,'Flexible Hose':35,'Room Ceiling':50,'Bathroom Ceiling':50};
function costLines(r){let lines=[];for(let v of entries(r)){for(let [j,d] of v.defects.entries())lines.push({key:'f-'+v.i+'-'+v.o+'-'+j,name:NAMES[v.i],owner:OWNERS[v.o],qty:+d.qty,type:d.type})}for(let [n,v] of Object.entries(r.fac||{}))if(v.status==='defect')lines.push({key:'a-'+n,name:facilityLabel(n,r),owner:'Facility',qty:+v.qty,type:v.type});return lines}
function defaultPrice(line){if(line.owner==='UTMSPACE'||['Leaking','Moldy','Water Mark','Other'].includes(line.type))return null;return FIXED_PRICE[line.name]??null}
function costReport(r){let lines=costLines(r),pending=0,total=0;let body=lines.map(l=>{let setting=r.cost?.[l.key],price=setting?setting.price:defaultPrice(l);if(price===null)pending++;else total+=price*l.qty;let ref=l.name==='Fan'?'Pensonic / Khind RM178; Hitec RM150':l.name.endsWith('Wall')?`${r.p}P painting reference RM${r.p===4?520:470} per room — quote scope must be confirmed`:defaultPrice(l)!==null?`RM${defaultPrice(l).toFixed(2)} per unit`:l.owner==='UTMSPACE'?'UTMSPACE price not supplied':'Price not supplied';return `<tr><td>${esc(l.name)}<br><small>${esc(l.owner)} · ${esc(l.type)}</small></td><td>${l.qty}</td><td style="white-space:normal;min-width:160px">${esc(ref)}${['Toilet Basin','Room Ceiling','Bathroom Ceiling'].includes(l.name)?'<br><small>Labor only; material not supplied</small>':''}${l.name.includes('Switch')?'<br><small>Generic Switch rate; labor only</small>':''}</td><td>${l.name==='Fan'?`<select onchange="setCost('${l.key}',this.value)"><option value="">Select brand</option>${[['178','Pensonic / Khind'],['150','Hitec']].map(([v,t])=>`<option value="${v}" ${price==+v?'selected':''}>${t} · RM${v}</option>`).join('')}</select>`:''}<input aria-label="Unit cost ${esc(l.name)}" type="number" min="0" step="0.01" placeholder="Pending" value="${price??''}" onchange="setCost('${l.key}',this.value)"></td><td>${price===null?'Pending':'RM '+(price*l.qty).toFixed(2)}</td></tr>`}).join('');return `<div class="cd"><h3>Estimated repair cost · KLG 2026 reference</h3><p class="note">Material + Labor from the supplied table. Missing material prices remain incomplete estimates. UTMSPACE prices are entered separately. Leaks / mold remediation are subject to quotation. Wall painting reference is per room; no automatic charge for both room and bathroom.</p><div class="tw"><table><tr><th>Defect</th><th>Qty</th><th>Reference</th><th>Unit cost (RM)</th><th>Amount</th></tr>${body||'<tr><td colspan="5">No defects</td></tr>'}</table></div><p><b>Known subtotal: RM ${total.toFixed(2)}</b>${pending?` · ${pending} item(s) pending price`:''}</p><p class="note">Prices are saved with the inspection. Blank means pending, not RM0.</p><details><summary>View full price reference</summary><div class="tw"><table><tr><th>Item</th><th>Brand</th><th>Material</th><th>Labor</th><th>Material + Labor</th></tr>${PRICE_SOURCE.map(x=>`<tr>${['name','brand','material','labor','total'].map(k=>`<td style="white-space:pre-line;text-align:left">${esc(x[k]??'Pending')}</td>`).join('')}</tr>`).join('')}</table></div></details></div>`}
function costSummary(r){let total=0,pending=0;for(let l of costLines(r)){let setting=r.cost?.[l.key],price=setting?setting.price:defaultPrice(l);if(price===null||!Number.isFinite(price)||!Number.isFinite(l.qty)||l.qty<1)pending++;else total+=price*l.qty}return 'Est. cost RM '+total.toFixed(2)+(pending?' · '+pending+' Pending':'')}
function setCost(key,value){if(value!==''&&(!Number.isFinite(+value)||+value<0))return alert('Enter a valid amount.');if(cur&&tab==='ins'){cur.cost??={};cur.cost[key]={price:value===''?null:+value};render();return;}let next=structuredClone(records);let r=next.find(x=>x.id===report.id);r.cost??={};r.cost[key]={price:value===''?null:+value};try{localStorage.setItem(KEY,JSON.stringify(next));records=next;report=r;render()}catch(e){alert('Unable to save cost. Export a backup and check storage.') }}

function totals(){let rs=Object.values(ROOMS).filter(r=>r.b===block).map(r=>latest(r.room)).filter(Boolean);return `<div class="cd"><h3>Furniture ownership · Block ${block}</h3><p class="note">Latest round per room only. Actual totals include only owner-confirmed records. Unchecked UTMSPACE is excluded. Missing is not counted as present furniture.</p><div class="row"><button onclick="block='A';render()">Block A</button><button onclick="block='B';render()">Block B</button><button onclick="exportCSV()">Export CSV</button></div></div><div class="tw cd"><table><tr><th>Furniture</th><th>Owner</th><th>PDF reference</th><th>Confirmed present</th><th>Good</th><th>Broken</th><th>Missing</th><th>Other</th><th>Confirmed rooms</th></tr>${NAMES.flatMap((n,i)=>OWNERS.map((o,j)=>{let vs=rs.map(r=>r.items[i][j]).filter(v=>v.enabled&&v.confirm),def=t=>vs.reduce((s,v)=>s+v.defects.filter(d=>d.type===t).reduce((a,d)=>a+ +d.qty,0),0);return `<tr><td>${n}</td><td>${o}</td><td>${Object.values(ROOMS).filter(r=>r.b===block).reduce((s,r)=>s+r.ref[j][i],0)}</td><td>${vs.reduce((s,v)=>s+ +v.qty,0)}</td><td>${vs.reduce((s,v)=>s+(v.status==='good'?+v.qty:v.status==='defect'?Math.max(0,+v.qty-v.defects.filter(d=>d.type!=='Missing').reduce((a,d)=>a+ +d.qty,0)):0),0)}</td><td>${def('Broken')}</td><td>${def('Missing')}</td><td>${def('Other')}</td><td>${vs.length}</td></tr>`})).join('')}</table></div>`}
function exportCSV(){let rows=[['Room','Round','Date','Inspector','Furniture','Owner','PDF Qty','Present Qty','Owner Confirmed','Condition','Defect','Defect Qty','Remark']];for(let room of Object.keys(ROOMS)){let r=latest(room);if(!r)continue;for(let v of entries(r))for(let d of v.defects.length?v.defects:[{type:'',qty:'',remark:''}])rows.push([room,r.round,r.date,r.by,NAMES[v.i],OWNERS[v.o],r.ref[v.o][v.i],v.qty,v.confirm,v.status,d.type,d.qty,d.remark]);for(let [name,v] of Object.entries(r.fac||{}))rows.push([room,r.round,r.date,r.by,facilityLabel(name,r),'Facility','', '', '',v.status,v.status==='defect'?v.type:'',v.status==='defect'?v.qty:'',v.remark]);}download('AB_Furniture_Inspection.csv','﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}
function backup(){download('AB_Inspection_Backup.json',JSON.stringify({schema:KEY,records},null,2),'application/json')}
async function restore(file){try{let d=JSON.parse(await file.text());if(d.schema!==KEY||!Array.isArray(d.records))throw Error('Invalid backup');for(let r of d.records)if(!ROOMS[r.room]||!Array.isArray(r.items)||r.items.length!==5||r.items.some(a=>!Array.isArray(a)||a.length!==2||a.some(v=>!Array.isArray(v.defects)||!Array.isArray(v.photos))))throw Error('Invalid inspection');let map=new Map(records.map(r=>[r.id,r]));for(let r of d.records)map.set(r.id,r);let next=[...map.values()];localStorage.setItem(KEY,JSON.stringify(next));records=next;render()}catch(e){alert('Import failed: '+e.message)}}
function render(){$('#nv').innerHTML=['sum','ins','tot','prices'].map((t,i)=>`<button class="${tab===t?'on':''}" onclick="tab='${t}';render()">${['Summary','Inspect','Furniture Totals','Cost Reference'][i]}</button>`).join('')+`<button onclick="backup()">Backup</button><label style="margin:0"><button onclick="$('#import').click()">Import</button><input id="import" hidden type="file" accept="application/json" onchange="restore(this.files[0])"></label>`;$('#m').innerHTML=tab==='sum'?summary():tab==='ins'?inspection():tab==='tot'?totals():tab==='prices'?costReport({items:NAMES.map(()=>OWNERS.map(()=>({enabled:false}))),fac:{},p:2}).replace('<details>','<details open>'):reportHtml()}
function updateLive(){if(cur){const p=progress(cur,cur),e=document.getElementById('live-progress');if(e)e.innerHTML=p.pct+'% · '+p.done+'/'+p.total+' checks<br><b id="live-cost">'+costSummary(cur)+'</b>'}}document.addEventListener('input',updateLive);document.addEventListener('change',updateLive);
render();
</script></html>
